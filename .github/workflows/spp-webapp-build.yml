name: SPP webapp build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel-build:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Remove image rustup, cargo, and jq
        run: |
          set -eux
          if command -v rustup >/dev/null 2>&1; then
            rustup self uninstall -y || true
          fi
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          sudo rm -rf /usr/share/rust /usr/local/cargo /usr/local/rustup /opt/hostedtoolcache/rust /etc/skel/.cargo /etc/skel/.rustup
          if dpkg -s jq >/dev/null 2>&1; then
            sudo apt-get remove -y jq
          fi
          sudo rm -f /usr/bin/jq /usr/local/bin/jq
          hash -r
          cleaned="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -E '/\.cargo/bin$|/\.rustup/|hostedtoolcache/rust' | paste -sd: -)"
          echo "PATH=$cleaned" >> "$GITHUB_ENV"

      # pnpm/action-setup v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.4

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Require jq, rustup, and cargo to be absent
        run: |
          set -eu
          failed=0
          for tool in jq rustup cargo; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "still on PATH: $tool -> $(command -v "$tool")" >&2
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "the build image still has jq, rustup, or cargo on PATH" >&2
            exit 1
          fi
          echo "jq rustup cargo absent"

      - name: Install
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/spp-logs"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/spp-logs/install.txt"

      - name: Build
        id: spp_build
        continue-on-error: true
        env:
          CC_ENABLE_DEBUG_OUTPUT: "1"
          CARGO_TERM_VERBOSE: "true"
          SPP_DIAGNOSTIC_LABEL: primary
        run: |
          set -o pipefail
          pnpm build:webapp 2>&1 | tee "$RUNNER_TEMP/spp-logs/build-webapp.txt"

      - name: Extract actual cc-rs compiler evidence from the SPP build
        if: always()
        continue-on-error: true
        run: |
          set -eu
          source="$RUNNER_TEMP/spp-logs/build-webapp.txt"
          destination="$RUNNER_TEMP/spp-proof/wasm/cc-rs-actual-build.txt"
          mkdir -p "$(dirname "$destination")"
          python3 - "$source" "$destination" <<'PY'
          import sys
          from pathlib import Path

          source, destination = map(Path, sys.argv[1:])
          if not source.is_file():
              destination.write_text("Primary SPP build log is missing.\n")
              raise SystemExit(0)
          lines = source.read_text(errors="replace").splitlines()
          needles = (
              "sqlite-wasm-rs",
              "CC_ENABLE_DEBUG_OUTPUT",
              "cargo:warning=Compiler family detected",
              "cargo:warning=ToolFamily",
              "cargo:warning=running:",
              "cargo:warning=ar:",
              "Running \`cc\`",
              "Running \`clang\`",
              "running: ",
              "OUT_DIR",
              "wsqlite3",
          )
          selected = set()
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 3)))
          if not selected:
              destination.write_text("No cc-rs compiler invocation lines matched; inspect build-webapp.txt.\n")
          else:
              destination.write_text("\n".join(f"{i+1}: {lines[i]}" for i in sorted(selected)) + "\n")
          print(f"Wrote actual cc-rs build excerpts to {destination}")
          PY

      - name: Repeat SPP build with a fresh Cargo target
        if: always()
        continue-on-error: true
        env:
          CC_ENABLE_DEBUG_OUTPUT: "1"
          CARGO_TERM_VERBOSE: "true"
          SPP_DIAGNOSTIC_LABEL: clean-rebuild
          SPP_BUILD_ROOT: "${{ github.workspace }}/.cache/spp-upstream"
          CARGO_TARGET_DIR: "${{ github.workspace }}/.cache/spp-upstream/clean-repro-target"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/spp-logs"
          bash scripts/prepare-spp-runtime.sh 2>&1 | tee "$RUNNER_TEMP/spp-logs/clean-rebuild.txt"

      - name: Compare primary and clean-rebuild WASM stages
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/spp-proof/manifest"
          python3 - "$GITHUB_WORKSPACE/.cache/spp-upstream/diagnostics" "$RUNNER_TEMP/spp-proof/manifest/reproducibility.json" <<'PY'
          import json, sys
          from pathlib import Path

          root, destination = Path(sys.argv[1]), Path(sys.argv[2])
          labels = ("primary", "clean-rebuild")

          def read_json(path):
              return json.loads(path.read_text()) if path.is_file() else None

          def trace_map(path, field):
              rows = []
              if path.is_file():
                  for line in path.read_text().splitlines():
                      event = json.loads(line)
                      for item in event.get(field, []):
                          if item.get("sha256"):
                              rows.append((Path(item["path"]).name, item["sha256"], item["size"]))
              return {name: {"sha256": sha, "size": size} for name, sha, size in rows}

          def compare_maps(a, b):
              if not a or not b:
                  return {"status": "MISSING", "primary": a, "cleanRebuild": b}
              return {
                  "status": "MATCH" if a == b else "DIFFERENT",
                  "primary": a,
                  "cleanRebuild": b,
              }

          result = {"labels": {}, "comparisons": {}}
          for label in labels:
              folder = root / label
              result["labels"][label] = {
                  "wasmBindgen": read_json(folder / "raw-wasm.json"),
                  "sqliteBuild": read_json(folder / "sqlite-build-report.json"),
              }
          for tool in ("wasm-bindgen", "wasm-opt"):
              result["comparisons"][tool] = compare_maps(
                  trace_map(root / "primary" / f"{tool}.jsonl", "output_after"),
                  trace_map(root / "clean-rebuild" / f"{tool}.jsonl", "output_after"),
              )
          for name in ("raw-wasm.json", "sqlite-build-report.json"):
              a = result["labels"]["primary"].get("wasmBindgen" if name == "raw-wasm.json" else "sqliteBuild")
              b = result["labels"]["clean-rebuild"].get("wasmBindgen" if name == "raw-wasm.json" else "sqliteBuild")
              if name == "raw-wasm.json":
                  amap = {k: v for k, v in (a or {}).items() if isinstance(v, dict) and v.get("sha256")}
                  bmap = {k: v for k, v in (b or {}).items() if isinstance(v, dict) and v.get("sha256")}
                  result["comparisons"]["raw-rust-wasm"] = compare_maps(amap, bmap)
              else:
                  amap = {Path(x["name"]).name: {"sha256": x["sha256"], "size": x["size"]} for x in (a or {}).get("archives", [])}
                  bmap = {Path(x["name"]).name: {"sha256": x["sha256"], "size": x["size"]} for x in (b or {}).get("archives", [])}
                  result["comparisons"]["sqlite-static-archives"] = compare_maps(amap, bmap)
          destination.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result["comparisons"], indent=2, sort_keys=True))
          PY

      - name: Capture all built SPP hashes before asserting pins
        if: always()
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/spp-proof"
          runtime=".cache/spp-upstream/stellar-private-payments/sdk/web"
          mkdir -p "$proof/wasm" "$proof/manifest"
          if [ -d ".cache/spp-upstream/diagnostics" ]; then
            cp -a ".cache/spp-upstream/diagnostics" "$proof/"
          fi
          for entry in \
            "dist/stellar_private_payments_web_bg.wasm:main.wasm" \
            "dist/workers/prover-worker-module_bg.wasm:prover-worker.wasm" \
            "dist/workers/storage-worker-module_bg.wasm:storage-worker.wasm"; do
            source_path="${entry%%:*}"
            evidence_name="${entry#*:}"
            if [ -f "$runtime/$source_path" ]; then
              cp "$runtime/$source_path" "$proof/wasm/$evidence_name"
            fi
          done
          {
            echo "=== native compiler commands (cc-rs) ==="
            for tool in cc clang clang-18 clang-19 wasm-ld wasm-ld-18 llvm-ar llvm-ranlib ar ranlib; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "--- $tool: $(command -v "$tool")"
                "$tool" --version 2>&1 | sed -n '1,4p' || true
              fi
            done
            for name in CC CC_wasm32_unknown_unknown TARGET_CC AR AR_wasm32_unknown_unknown CFLAGS CFLAGS_wasm32_unknown_unknown; do
              eval "value=\${$name-}"
              printf '%s=%s\n' "$name" "${value:-<unset>}"
            done
            echo "=== rust toolchain ==="
            if [ -x "$HOME/.cargo/bin/rustc" ]; then
              "$HOME/.cargo/bin/rustc" +1.97.1 --version --verbose
              "$HOME/.cargo/bin/cargo" +1.97.1 --version --verbose
            fi
            wasm_opt="$runtime/../../target/tmp/binaryen/binaryen-version_131/bin/wasm-opt"
            if [ -x "$wasm_opt" ]; then "$wasm_opt" --version; fi
          } > "$proof/wasm/toolchain.txt"
          python3 - \
            packages/wallet-core/src/stellar/spp/nethermind/spp-runtime-manifest.json \
            "$runtime" "$proof/manifest/comparison.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          manifest_path, web_root, output_path = map(Path, sys.argv[1:])
          result = {
              "runtimePresent": (web_root / "dist").is_dir(),
              "sourceCommit": None,
              "matches": [],
              "mismatches": [],
          }
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text())
              result["sourceCommit"] = manifest.get("sourceCommit")
              for rel, expected in manifest.get("files", {}).items():
                  path = web_root / rel
                  if not path.is_file():
                      result["mismatches"].append({
                          "path": rel, "reason": "missing",
                          "expectedSha256": expected.get("sha256"),
                          "expectedSize": expected.get("size"),
                      })
                      continue
                  data = path.read_bytes()
                  actual = {
                      "path": rel,
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size": len(data),
                  }
                  if actual["sha256"] == expected.get("sha256") and actual["size"] == expected.get("size"):
                      result["matches"].append(actual)
                  else:
                      actual["expectedSha256"] = expected.get("sha256")
                      actual["expectedSize"] = expected.get("size")
                      result["mismatches"].append(actual)
          else:
              result["error"] = "Versioned SPP manifest is missing"
          output_path.write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({
              "runtimePresent": result["runtimePresent"],
              "sourceCommit": result["sourceCommit"],
              "matched": len(result["matches"]),
              "mismatched": len(result["mismatches"]),
              "report": str(output_path),
          }, indent=2))
          PY
          if [ -f "$proof/wasm/main.wasm" ]; then
            curl --proto '=https' -fsSL -o "$RUNNER_TEMP/wabt.tar.gz.partial" \
              https://github.com/WebAssembly/wabt/releases/download/1.0.37/wabt-1.0.37-ubuntu-20.04.tar.gz
            echo "cfc675dc9b663d9adc8c75d982c1ba29f661448a2e026a67e71fe3f76a3e09f3  $RUNNER_TEMP/wabt.tar.gz.partial" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/wabt"
            tar -xzf "$RUNNER_TEMP/wabt.tar.gz.partial" -C "$RUNNER_TEMP/wabt"
            obj="$RUNNER_TEMP/wabt/wabt-1.0.37/bin/wasm-objdump"
            for name in main prover-worker storage-worker; do
              wasm="$proof/wasm/$name.wasm"
              if [ -f "$wasm" ]; then
                "$obj" -h "$wasm" > "$proof/wasm/$name-section-headers.txt"
                "$obj" -x "$wasm" | python3 scripts/spp-wasm-sections.py > "$proof/wasm/$name-import-memory-export.txt"
              fi
            done
            if diff -u scripts/spp-wasm-sections-fb3481af.txt "$proof/wasm/main-import-memory-export.txt" > "$proof/wasm/section-diff.txt"; then
              echo "IDENTICAL to fb3481af import, memory, and export sections" | tee "$proof/wasm/section-result.txt"
            else
              echo "DIFFERENT from fb3481af import, memory, or export sections" | tee "$proof/wasm/section-result.txt"
            fi
          else
            echo "main wasm missing; section comparison unavailable" > "$proof/wasm/section-result.txt"
          fi

      - name: Upload SPP build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spp-build-diagnostics
          path: |
            ${{ runner.temp }}/spp-logs
            ${{ runner.temp }}/spp-proof
          if-no-files-found: error

      - name: Assert the versioned runtime manifest
        if: always()
        env:
          SPP_BUILD_OUTCOME: ${{ steps.spp_build.outcome }}
        run: |
          set -euo pipefail
          if [ "$SPP_BUILD_OUTCOME" != "success" ]; then
            echo "SPP webapp Build step concluded: $SPP_BUILD_OUTCOME" >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/spp-proof/manifest/comparison.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("SPP runtime diagnostic report was not produced")
          result = json.loads(path.read_text())
          if not result.get("runtimePresent"):
              raise SystemExit("SPP upstream runtime was not built")
          if result.get("mismatches"):
              for item in result["mismatches"]:
                  print(json.dumps(item, sort_keys=True))
              raise SystemExit(f"{len(result['mismatches'])} SPP runtime manifest mismatch(es)")
          print(f"All {len(result['matches'])} versioned SPP runtime files match.")
          PY
