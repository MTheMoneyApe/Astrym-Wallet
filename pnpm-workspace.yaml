packages:
  - 'packages/*'

# Allow native build scripts for transitive Solana SDK dependencies.
# These three packages compile C++ bindings and must run their install scripts.
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  utf-8-validate: true

patchedDependencies:
  '@nymproject/mix-tunnel@0.3.0': patches/@nymproject__mix-tunnel@0.3.0.patch
