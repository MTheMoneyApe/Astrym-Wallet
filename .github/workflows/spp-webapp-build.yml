name: SPP webapp build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Remove image rustup, cargo, and jq
        run: |
          set -eux
          if command -v rustup >/dev/null 2>&1; then
            rustup self uninstall -y || true
          fi
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          sudo rm -rf /usr/share/rust /usr/local/cargo /usr/local/rustup /opt/hostedtoolcache/rust /etc/skel/.cargo /etc/skel/.rustup
          if dpkg -s jq >/dev/null 2>&1; then
            sudo apt-get remove -y jq
          fi
          sudo rm -f /usr/bin/jq /usr/local/bin/jq
          hash -r
          cleaned="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -E '/\.cargo/bin$|/\.rustup/|hostedtoolcache/rust' | paste -sd: -)"
          echo "PATH=$cleaned" >> "$GITHUB_ENV"

      # pnpm/action-setup v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.4

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Require jq, rustup, and cargo to be absent
        run: |
          set -eu
          failed=0
          for tool in jq rustup cargo; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "still on PATH: $tool -> $(command -v "$tool")" >&2
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "the build image still has jq, rustup, or cargo on PATH" >&2
            exit 1
          fi
          echo "jq rustup cargo absent"

      - name: Install
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/spp-logs"
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/spp-logs/install.txt"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build:webapp 2>&1 | tee "$RUNNER_TEMP/spp-logs/build-webapp.txt"

      - name: Capture WASM build forensics (even on pin mismatch)
        if: always()
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/spp-proof/forensics"
          source=".cache/spp-upstream/stellar-private-payments/sdk/web"
          mkdir -p "$proof"
          for name in \
            stellar_private_payments_web_bg.wasm \
            workers/storage-worker-module_bg.wasm \
            workers/prover-worker-module_bg.wasm; do
            file="$source/dist/$name"
            if [ -f "$file" ]; then
              mkdir -p "$proof/wasm/$(dirname "$name")"
              cp "$file" "$proof/wasm/$name"
            fi
          done
          if [ -f "$source/.trunk-wasm-profile" ]; then
            cp "$source/.trunk-wasm-profile" "$proof/trunk-wasm-profile.txt"
          fi
          if [ -f ".cache/spp-upstream/rust-flags.txt" ]; then
            cp ".cache/spp-upstream/rust-flags.txt" "$proof/"
          fi
          python3 - "$proof" "packages/wallet-core/src/stellar/spp/nethermind/spp-runtime-manifest.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          root, manifest_path = Path(sys.argv[1]), Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text())
          names = [
              "stellar_private_payments_web_bg.wasm",
              "workers/storage-worker-module_bg.wasm",
              "workers/prover-worker-module_bg.wasm",
          ]

          def leb(data, pos):
              value = shift = 0
              while True:
                  if pos >= len(data):
                      raise ValueError("truncated LEB128")
                  byte = data[pos]
                  pos += 1
                  value |= (byte & 0x7f) << shift
                  if byte < 0x80:
                      return value, pos
                  shift += 7
                  if shift > 35:
                      raise ValueError("oversized LEB128")

          records = []
          for name in names:
              path = root / "wasm" / name
              if not path.is_file():
                  records.append({"path": name, "present": False})
                  continue
              data = path.read_bytes()
              if data[:4] != b"\0asm":
                  raise SystemExit(f"{name}: invalid wasm magic")
              sections, pos = [], 8
              while pos < len(data):
                  section_id = data[pos]
                  pos += 1
                  size, pos = leb(data, pos)
                  body = data[pos:pos + size]
                  if len(body) != size:
                      raise SystemExit(f"{name}: truncated section {section_id}")
                  pos += size
                  entry = {
                      "id": section_id,
                      "size": size,
                      "sha256": hashlib.sha256(body).hexdigest(),
                  }
                  if section_id == 0:
                      n, offset = leb(body, 0)
                      custom_name = body[offset:offset + n].decode("utf-8", "replace")
                      entry["customName"] = custom_name
                      entry["customPayloadSize"] = len(body) - offset - n
                      entry["customPayloadSha256"] = hashlib.sha256(body[offset + n:]).hexdigest()
                  sections.append(entry)
              expected = manifest["files"].get("dist/" + name)
              records.append({
                  "path": name,
                  "present": True,
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "expected": expected,
                  "sections": sections,
              })

          (root / "wasm-forensics.json").write_text(json.dumps({
              "sourceCommit": manifest["sourceCommit"],
              "records": records,
          }, indent=2) + "\n")
          print((root / "wasm-forensics.json").read_text())
          PY
          node - "$proof/wasm/stellar_private_payments_web_bg.wasm" "scripts/spp-wasm-sections-fb3481af.txt" <<'NODE'
          const fs = require("node:fs");
          const wasmPath = process.argv[2];
          const baselinePath = process.argv[3];
          const baseline = fs.readFileSync(baselinePath, "utf8").split(/\r?\n/);
          const expectedImports = [];
          const expectedExports = [];
          let section = "";
          for (const line of baseline) {
            if (line.startsWith("Import[")) { section = "imports"; continue; }
            if (line.startsWith("Memory[")) { section = "memory"; continue; }
            if (line.startsWith("Export[")) { section = "exports"; continue; }
            if (section === "imports") {
              const match = line.match(/^\s-\s(\w+)\[\d+\].*<-\s(.+)$/);
              if (match) {
                const target = match[2];
                const dot = target.lastIndexOf(".");
                if (dot <= 0) throw new Error("Cannot parse baseline import: " + line);
                expectedImports.push([target.slice(0, dot), target.slice(dot + 1), match[1]].join("|"));
              }
            } else if (section === "exports") {
              const match = line.match(/^\s-\s(\w+)\[\d+\].*-> "([^"]+)"$/);
              if (match) expectedExports.push([match[2], match[1]].join("|"));
            }
          }
          const module = new WebAssembly.Module(fs.readFileSync(wasmPath));
          const kind = (value) => value === "function" ? "func" : value;
          const actualImports = WebAssembly.Module.imports(module)
            .map((entry) => [entry.module, entry.name, kind(entry.kind)].join("|"));
          const actualExports = WebAssembly.Module.exports(module)
            .map((entry) => [entry.name, kind(entry.kind)].join("|"));
          const sort = (values) => values.slice().sort();
          const same = (a, b) => JSON.stringify(sort(a)) === JSON.stringify(sort(b));
          const result = {
            imports: { expected: expectedImports.length, actual: actualImports.length, identical: same(expectedImports, actualImports) },
            exports: { expected: expectedExports.length, actual: actualExports.length, identical: same(expectedExports, actualExports) },
          };
          fs.writeFileSync(process.env.RUNNER_TEMP + "/spp-proof/forensics/wasm-api-compat.json", JSON.stringify(result, null, 2) + "\n");
          console.log(JSON.stringify(result));
          if (!result.imports.identical || !result.exports.identical) process.exit(1);
          NODE
          if [ -f "$RUNNER_TEMP/spp-logs/build-webapp.txt" ]; then
            grep -E '^(TOOL |SOURCE_DATE_EPOCH |NOTICE date |effective RUSTFLAGS:|effective CFLAGS:|PATH rustup )' "$RUNNER_TEMP/spp-logs/build-webapp.txt" > "$proof/build-toolchain-from-prepare.log" || true
          fi
          {
            echo "commit=$GITHUB_SHA"
            echo "runner=$(uname -s)-$(uname -m)"
            echo "kernel=$(uname -a)"
            echo "rustc=$(rustc --version 2>/dev/null || true)"
            echo "rustc_verbose=$(rustc -vV 2>/dev/null | tr '\\n' ';' || true)"
            echo "cargo=$(cargo --version 2>/dev/null || true)"
            echo "cargo_verbose=$(cargo -vV 2>/dev/null | tr '\\n' ';' || true)"
            echo "cc=$(cc --version 2>/dev/null | head -n 1 || true)"
            echo "clang=$(clang --version 2>/dev/null | head -n 1 || true)"
            echo "cxx=$(c++ --version 2>/dev/null | head -n 1 || true)"
            echo "wasm_bindgen=$(wasm-bindgen --version 2>/dev/null || true)"
            echo "wasm_opt=$(.cache/spp-upstream/stellar-private-payments/target/tmp/binaryen/binaryen-version_131/bin/wasm-opt --version 2>/dev/null || true)"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH:-unset}"
            echo "build_root=$PWD/.cache/spp-upstream"
          } > "$proof/toolchain-and-paths.txt"
          find "$proof" -type f -printf '%P %s bytes\n' | sort > "$proof/files.txt"

      - name: Upload WASM build forensics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spp-wasm-build-forensics
          path: ${{ runner.temp }}/spp-proof/forensics
          if-no-files-found: warn

      - name: Upload SPP build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spp-build-logs
          path: ${{ runner.temp }}/spp-logs
          if-no-files-found: warn

      - name: Record the SHA-256 manifest and wasm sections
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/spp-proof"
          mkdir -p "$proof/manifest" "$proof/sections"
          python3 scripts/spp-distributed-sha256.py \
            packages/wallet-core/src/stellar/spp/nethermind/spp-runtime-manifest.json \
            packages/extension/public/spp \
            "$proof/manifest/spp-distributed-sha256.txt"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/wabt.tar.gz.partial" \
            https://github.com/WebAssembly/wabt/releases/download/1.0.37/wabt-1.0.37-ubuntu-20.04.tar.gz
          echo "cfc675dc9b663d9adc8c75d982c1ba29f661448a2e026a67e71fe3f76a3e09f3  $RUNNER_TEMP/wabt.tar.gz.partial" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wabt"
          tar -xzf "$RUNNER_TEMP/wabt.tar.gz.partial" -C "$RUNNER_TEMP/wabt"
          obj="$RUNNER_TEMP/wabt/wabt-1.0.37/bin/wasm-objdump"
          wasm="packages/extension/public/spp/dist/stellar_private_payments_web_bg.wasm"
          "$obj" -x "$wasm" | python3 scripts/spp-wasm-sections.py > "$proof/sections/built-import-memory-export.txt"
          if diff -u scripts/spp-wasm-sections-fb3481af.txt "$proof/sections/built-import-memory-export.txt" > "$proof/sections/section-diff.txt"; then
            echo "IDENTICAL to fb3481af import, memory, and export sections" | tee "$proof/sections/section-result.txt"
          else
            echo "DIFFERENT from fb3481af import, memory, or export sections" | tee "$proof/sections/section-result.txt"
            exit 1
          fi

      # actions/upload-artifact v4.6.2
      - name: Upload the SHA-256 manifest
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spp-sha256-manifest
          path: ${{ runner.temp }}/spp-proof/manifest
          if-no-files-found: error

      # actions/upload-artifact v4.6.2
      - name: Upload the wasm section comparison
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spp-wasm-sections
          path: ${{ runner.temp }}/spp-proof/sections
          if-no-files-found: error

      - name: Enforce the SPP build result after diagnostics
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "SPP webapp build failed; forensic artifacts were uploaded above." >&2
            exit 1
          fi
